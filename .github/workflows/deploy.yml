name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build image, push to GHCR, smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.CLOUD_TOKEN }}" ]; then
            echo "::error::CLOUD_TOKEN secret is not set in repository secrets"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Set lowercase image name
        # GHCR требует имя репозитория в нижнем регистре,
        # а ${{ github.repository }} сохраняет регистр username'а
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container for smoke test
        run: |
          docker run -d \
            --name ml-service-test \
            -p 8000:8000 \
            -e MODEL_VERSION="${{ secrets.MODEL_VERSION || 'v1.0.0' }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "Waiting for service to start..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service ready after ${i}s"
              break
            fi
            sleep 1
            if [ $i -eq 30 ]; then
              echo "Service did not start in 30 seconds"
              docker logs ml-service-test
              exit 1
            fi
          done

      - name: Health check
        run: |
          echo "GET /health:"
          curl -fsS http://localhost:8000/health | python -m json.tool

      - name: Predict check (valid input)
        run: |
          echo "POST /predict with [5.1, 3.5, 1.4, 0.2]:"
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"x": [5.1, 3.5, 1.4, 0.2]}' | python -m json.tool

      - name: Predict check (invalid input - should return 400)
        run: |
          echo "POST /predict with 3 features (should return 400):"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"x": [1, 2, 3]}')
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "::error::Expected 400, got $STATUS"
            exit 1
          fi
          echo "Got 400 as expected (validation works correctly)"

      - name: Show container logs (always)
        if: always()
        run: docker logs ml-service-test

      - name: Cleanup
        if: always()
        run: docker stop ml-service-test || true